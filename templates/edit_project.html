{% extends "base.html" %}

{% block title %}Editar Projeto - Sistema de Controle de Projetos{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Editar Projeto</h2>
        
        <form method="POST">
            <div class="form-group">
                <label for="name">Nome do Projeto:</label>
                <input type="text" id="name" name="name" value="{{ project.name }}" required>
            </div>
            
            <div class="form-group">
                <label for="description">Descrição:</label>
                <textarea id="description" name="description">{{ project.description or '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="status">Status:</label>
                <select id="status" name="status">
                    <option value="ativo" {% if project.status == 'ativo' %}selected{% endif %}>Ativo</option>
                    <option value="pausado" {% if project.status == 'pausado' %}selected{% endif %}>Pausado</option>
                    <option value="concluído" {% if project.status == 'concluído' %}selected{% endif %}>Concluído</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-success">Salvar Alterações</button>
                <a href="{{ url_for('view_project', project_id=project.id) }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
