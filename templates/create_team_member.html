{% extends "base.html" %}

{% block title %}Adicionar Membro - Sistema de Controle de Projetos{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Adicionar Membro da Equipe</h2>
        <p style="color: #7f8c8d;">Projeto: <strong>{{ project.name }}</strong></p>
        
        <form method="POST">
            <div class="form-group">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required placeholder="Ex: João Silva">
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Ex: joao@example.com">
            </div>
            
            <div class="form-group">
                <label for="role">Função:</label>
                <select id="role" name="role" required>
                    <option value="">Selecione uma função</option>
                    <option value="desenvolvedor">Desenvolvedor</option>
                    <option value="designer">Designer</option>
                    <option value="gerente">Gerente de Projeto</option>
                    <option value="analista">Analista</option>
                    <option value="tester">Tester</option>
                    <option value="outro">Outro</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-success">Adicionar Membro</button>
                <a href="{{ url_for('view_project', project_id=project.id) }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
