{% extends "base.html" %}

{% block title %}Editar Membro - Sistema de Controle de Projetos{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Editar Membro da Equipe</h2>
        <p style="color: #7f8c8d;">Projeto: <strong>{{ project.name }}</strong></p>
        
        <form method="POST">
            <div class="form-group">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" value="{{ member.name }}" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{ member.email }}" required>
            </div>
            
            <div class="form-group">
                <label for="role">Função:</label>
                <select id="role" name="role" required>
                    <option value="desenvolvedor" {% if member.role == 'desenvolvedor' %}selected{% endif %}>Desenvolvedor</option>
                    <option value="designer" {% if member.role == 'designer' %}selected{% endif %}>Designer</option>
                    <option value="gerente" {% if member.role == 'gerente' %}selected{% endif %}>Gerente de Projeto</option>
                    <option value="analista" {% if member.role == 'analista' %}selected{% endif %}>Analista</option>
                    <option value="tester" {% if member.role == 'tester' %}selected{% endif %}>Tester</option>
                    <option value="outro" {% if member.role == 'outro' %}selected{% endif %}>Outro</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-success">Salvar Alterações</button>
                <a href="{{ url_for('view_project', project_id=project.id) }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
