{% extends "base.html" %}

{% block title %}Nova Tarefa - Sistema de Controle de Projetos{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Criar Nova Tarefa</h2>
        <p style="color: #7f8c8d;">Projeto: <strong>{{ project.name }}</strong></p>
        
        <form method="POST">
            <div class="form-group">
                <label for="title">Título:</label>
                <input type="text" id="title" name="title" required placeholder="Ex: Implementar autenticação">
            </div>
            
            <div class="form-group">
                <label for="description">Descrição:</label>
                <textarea id="description" name="description" placeholder="Descreva a tarefa em detalhes..."></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="priority">Prioridade:</label>
                    <select id="priority" name="priority">
                        <option value="baixa">Baixa</option>
                        <option value="média" selected>Média</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="assigned_to_id">Atribuir a:</label>
                    <select id="assigned_to_id" name="assigned_to_id">
                        <option value="">Ninguém</option>
                        {% for member in team_members %}
                        <option value="{{ member.id }}">{{ member.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="due_date">Data Limite:</label>
                <input type="date" id="due_date" name="due_date">
            </div>
            
            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-success">Criar Tarefa</button>
                <a href="{{ url_for('view_project', project_id=project.id) }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
