{% extends "base.html" %}

{% block title %}Registrar - Sistema de Controle de Projetos{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 5rem auto;">
    <div class="card">
        <h2 style="text-align: center;">Registrar</h2>
        
        <form method="POST">
            <div class="form-group">
                <label for="username">Nome de Usuário:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="password_confirm">Confirmar Senha:</label>
                <input type="password" id="password_confirm" name="password_confirm" required>
            </div>
            
            <button type="submit" style="width: 100%;">Registrar</button>
        </form>
        
        <p style="text-align: center; margin-top: 1rem;">
            Já tem uma conta? <a href="{{ url_for('login') }}" style="color: #3498db;">Faça login aqui</a>
        </p>
    </div>
</div>
{% endblock %}
